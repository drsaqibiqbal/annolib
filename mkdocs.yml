site_name: prostate-deid
site_description: De-identification and anatomical masking for prostate MRI
repo_url: https://github.com/<user>/prostate-deid
theme:
  name: readthedocs

nav:
  - Home: index.md
  - Quickstart: quickstart.md
  - API Reference: api.md
  - Anonymization vs. Pseudonymization: pseudonymization.md
  - Reviewer QA Dashboard: dashboard.md

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            show_source: false

markdown_extensions:
  - fenced_code
  - tables
